name: Build and upload wheel to GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python build tools
        run: pip install build jupyterlab hatch hatch-jupyter-builder hatch-nodejs-version

      - name: Install npm dependencies
        run: npm install

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload wheel to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
